<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF RAG Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Markdown rendering & sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Main Application -->
    <main class="app">
      <!-- HEADER -->
      <header class="header">
        <div class="logo">
          <div class="logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <div>
            <h1>PDF Assistant</h1>
            <p>Retrieval-Augmented Intelligent Chat</p>
          </div>
        </div>

        <div class="header-actions">
          <button id="uploadButton" class="upload-button" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Upload PDF
          </button>

          <input type="file" id="pdfInput" accept=".pdf,application/pdf" hidden />

          <div class="status">
            <span class="status-dot"></span>
            Online
          </div>

          <button id="clearButton" class="clear-button" type="button">
            Clear
          </button>
        </div>
      </header>

      <!-- CHAT AREA -->
      <section class="chat-container" id="chatContainer">
        <!-- Document Status -->
        <div id="documentStatus" class="document-status hidden">
          <div class="document-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </div>
          <div class="document-info">
            <strong id="documentName">No document</strong>
            <span id="documentMessage">Upload a PDF to begin</span>
          </div>
        </div>

        <!-- Welcome -->
        <div class="welcome">
          <div class="welcome-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
              <path d="M12 6a4 4 0 0 0-4 4 1 1 0 0 0 2 0 2 2 0 0 1 4 0c0 2-3 1.75-3 5a1 1 0 0 0 2 0c0-2.25 3-2.5 3-6a4 4 0 0 0-4-4z"/>
              <circle cx="12" cy="17" r="1"/>
            </svg>
          </div>
          <h2>Document Intelligence</h2>
          <p>
            Upload any PDF to extract semantic knowledge. Ask questions and get precise, context-backed answers.
          </p>
        </div>
      </section>

      <!-- INPUT AREA -->
      <section class="input-area">
        <div class="input-wrapper">
          <textarea
            id="questionInput"
            placeholder="Ask anything about your document..."
            rows="1"
          ></textarea>

          <button id="sendButton" type="button" aria-label="Send Question">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <p class="hint">FastAPI • ChromaDB • Hugging Face</p>
      </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
